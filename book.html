<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Malaysia Airlines — Continue to booking</title>
<style>
  :root{ --bg:#f5f6f8; --card:#fff; --ink:#12161c; --muted:#5b6472; --line:#e3e6ec; --brand:#00539f; --err:#b3261e; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1216; --card:#161b22; --ink:#e8ecf1; --muted:#98a2b3; --line:#242c36; --brand:#4da3ff; --err:#f87171; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:480px;margin:0 auto;padding:48px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
  h1{font-size:19px;margin:0 0 8px}
  p{margin:0 0 16px;color:var(--muted)}
  p.err{color:var(--err)}
  button{font:inherit;font-weight:600;padding:11px 18px;border-radius:8px;border:0;background:var(--brand);color:#fff;cursor:pointer;width:100%}
  [hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="title">Taking you to your booking…</h1>
    <p id="msg">This should only take a moment.</p>
    <button id="go" hidden>Continue to booking</button>
  </div>
</div>

<script>
/*
  Link launcher for the Ada booking flow.

  The AI Agent sends a link to this page. The link's fragment carries the form
  the booking page expects; this page rebuilds it and POSTs it, exactly like the
  flight_booking / express_booking event handlers on index.html — but started
  by the customer's own tap, so it works on any channel and keeps the chat open.

  Payload shape: {"post_url": "...", "method": "POST", "fields": {name: value, ...}}
  Carriers (fragment only, never sent to a server):
    #j=<encodeURIComponent(JSON)>   what Ada's evaljs action produces (no btoa there)
    #p=<base64url(JSON)>            same format sreac-relay.html accepts
*/
const ALLOWED_HOSTS = [
  "uat.digital.airline.amadeus.com", // express booking (Express Booking Redirector)
  "digital.airline.amadeus.com",
  "uat-book.malaysiaairlines.com",   // normal booking ([New] Booking Redirector)
];

const $ = (id) => document.getElementById(id);

// Customer-facing reasons — safe to show, never include payload values.
const REASONS = {
  missing: "The link has no booking details. Open it by tapping the link in the chat, not by typing or copying the address.",
  damaged: "The link's booking details are incomplete — it may have been cut off when it was copied.",
  destination: "The booking destination in the link isn't one this page is allowed to open.",
};

function fail(kind, detail) {
  $("title").textContent = "This booking link can't be opened";
  $("msg").textContent = REASONS[kind] + " Please go back to the chat and ask for a new link.";
  $("msg").className = "err";
  console.error("booking launcher:", kind, detail || "");
}

function readPayload() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get("j")) return JSON.parse(params.get("j"));
  if (params.get("p")) {
    const b64 = params.get("p").replace(/-/g, "+").replace(/_/g, "/");
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  return null;
}

function buildForm(payload) {
  const form = document.createElement("form");
  form.method = String(payload.method || "POST").toUpperCase();
  form.action = payload.post_url;
  form.target = "_self";
  form.style.display = "none";
  for (const [name, value] of Object.entries(payload.fields || {})) {
    if (value === undefined || value === null || value === "NONE") continue;
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = name;
    input.value = typeof value === "string" ? value : JSON.stringify(value);
    form.appendChild(input);
  }
  document.body.appendChild(form);
  return form;
}

(function launch() {
  let payload;
  try { payload = readPayload(); } catch (err) { return fail("damaged", err.message); }
  // Drop the payload from the address bar and browser history before anything else.
  history.replaceState(null, "", location.pathname + location.search);
  if (!payload) return fail("missing");

  let url;
  try { url = new URL(payload.post_url); } catch { return fail("destination", "post_url is not a valid URL"); }
  if (url.protocol !== "https:") return fail("destination", "post_url is not https");
  if (!ALLOWED_HOSTS.includes(url.hostname)) return fail("destination", "host not allow-listed: " + url.hostname);

  const form = buildForm(payload);
  form.submit();
  // If the browser hasn't left this page after a few seconds, offer a manual retry.
  setTimeout(() => {
    $("msg").textContent = "If nothing happened, tap the button below.";
    $("go").hidden = false;
    $("go").onclick = () => form.submit();
  }, 3000);
})();
</script>
</body>
</html>
