name = "mh-booking-redirect"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to send alerts (exact origins, comma-separated, no trailing slash).
#   https://jiapengchua.github.io    demo / test pages
#   https://uat.malaysiaairlines.com MAS UAT (includes the app chatbot page /hq/app/chatbot.html)
# For production, add: https://www.malaysiaairlines.com
ALLOWED_ORIGINS = "https://jiapengchua.github.io,https://uat.malaysiaairlines.com"
ADA_DASHBOARD_URL = "https://malaysiaairlines-sandbox.ada.support"
# Destinations are secrets — set one or both:
#   npx wrangler secret put SLACK_WEBHOOK_URL
#   npx wrangler secret put TEAMS_WEBHOOK_URL

# Keep every invocation and its logs (searchable in the Cloudflare dashboard for a few days),
# so an alert can be traced afterwards, not only while `wrangler tail` is running.
[observability]
enabled = true
head_sampling_rate = 1
